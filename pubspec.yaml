name: daily_note
description: Asisten pribadi berbasis AI (LLM) dengan input bahasa alami untuk jadwal, to-do, catatan, pengeluaran, dan reminder.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Local database (Drift/SQLite)
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # LLM on-device (pilih salah satu sesuai model yang dipakai)
  flutter_gemma: ^0.2.0
  # fllama: ^0.5.0   # alternatif jika pakai fllama, aktifkan sesuai kebutuhan

  # HTTP client untuk cloud fallback & proxy
  http: ^1.2.1

  # Voice input & output
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # Local notification (reminder)
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Email integration (Gmail API via backend proxy)
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0

  # Utility
  intl: ^0.19.0
  uuid: ^4.4.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation untuk Drift
  build_runner: ^2.4.11
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/lottie/
    # - assets/models/gemma-2b.bin   # aktifkan jika model on-device
    #   disertakan langsung di app (perhatikan ukuran APK)

  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700