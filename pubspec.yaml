name: daily_note
description: Asisten pribadi berbasis AI (LLM) dengan input bahasa alami untuk jadwal, to-do, catatan, pengeluaran, dan reminder.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Local database (Drift/SQLite)
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # LLM on-device
  flutter_gemma: ^0.2.0

  # HTTP client
  http: ^1.2.1

  # Voice input & output
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # Local notification
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Email integration
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0

  # Utility
  intl: ^0.19.0
  uuid: ^4.4.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  flutter_dotenv: ^6.0.1
  google_sign_in: ^6.2.1
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.11
  drift_dev: ^2.18.0

  # Launcher icon
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - .env

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icons/logo.jpg"
  remove_alpha_ios: true

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/logo.jpg"

  min_sdk_android: 21

flutter_native_splash:
  color: "#0A0F1C"
  image: "assets/icons/logo.jpg"
  android_12:
    color: "#0A0F1C"
    image: "assets/icons/logo.jpg"